---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#release
